<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Focus Editor | Open Source Content Optimizer</title>
    <meta name="description" content="A distraction-free, open-source SEO and content optimization editor with real-time readability, keyword density, E-E-A-T scoring, and bring-your-own-key AI assistance.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.3s ease, color 0.3s ease;
            background-color: #ffffff;
            color: #27272a;
        }
        
        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.06); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.25); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.08); border-radius: 10px; }

        /* Editorial Typography & Writing Canvas */
        .editor-content { 
            outline: none; 
            padding: 36px 56px 300px 56px; 
            min-height: 100%; 
            color: #27272a; 
            font-family: 'Source Serif 4', Georgia, Cambria, 'Times New Roman', serif;
            line-height: 1.8; 
            position: relative; 
            background: white; 
            font-size: 18.5px;
            font-weight: 400;
            letter-spacing: -0.003em;
            max-width: 100%;
            margin: 0;
            caret-color: #2563eb;
        }
        
        .editor-content::selection {
            background: #dbeafe;
            color: inherit;
        }

        .editor-content p { margin-bottom: 22px; position: relative; }
        
        .editor-content h1 { 
            font-size: 2.4rem; 
            font-weight: 600; 
            color: #18181b; 
            margin-bottom: 1.75rem; 
            margin-top: 1.25rem; 
            line-height: 1.2;
            letter-spacing: -0.02em;
        }
        
        .editor-content h2 { 
            font-size: 1.65rem; 
            font-weight: 600; 
            color: #18181b; 
            margin-top: 2.75rem; 
            margin-bottom: 1rem; 
            line-height: 1.3;
            letter-spacing: -0.015em;
        }
        
        .editor-content h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #27272a;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            line-height: 1.4;
            letter-spacing: -0.01em;
        }
        
        .editor-content blockquote { 
            border-left: 3px solid #d4d4d8; 
            font-style: italic; 
            color: #52525b; 
            margin: 2.25rem 0; 
            background: #fafafa; 
            padding: 1.25rem 1.75rem; 
            border-radius: 0 0.75rem 0.75rem 0; 
            font-size: 1.05em;
        }
        
        .editor-content a {
            color: #2563eb;
            text-decoration: underline;
            text-decoration-color: rgba(37, 99, 235, 0.35);
            text-underline-offset: 3px;
            transition: color 0.2s ease;
        }
        .editor-content a:hover {
            color: #1d4ed8;
            text-decoration-color: rgba(29, 78, 216, 0.6);
        }

        .para-warning { border-right: 3px solid #f87171; background: rgba(239, 68, 68, 0.02); }
        .para-warning::after { 
            content: "LONG PARAGRAPH"; 
            position: absolute; 
            right: 8px; 
            top: 4px; 
            font-family: 'Inter', sans-serif;
            font-size: 9px; 
            font-weight: 600; 
            color: #ef4444; 
            letter-spacing: 0.06em; 
            opacity: 0.45; 
            pointer-events: none;
        }

        [contenteditable]:empty:before { 
            content: "Start writing..."; 
            color: #a1a1aa; 
            font-style: italic; 
            pointer-events: none;
        }
    </style>
</head>
<body class="overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
